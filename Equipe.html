<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe — Controle de Ponto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563EB; --primary-dark: #1D4ED8; --success: #10B981; --danger: #EF4444;
            --bg-gradient: linear-gradient(180deg, #EFF6FF 0%, #E0EFFF 40%, #DBEAFE 100%);
            --card-bg: rgba(255,255,255,0.85); --border: #BFDBFE; --shadow: 0 4px 15px rgba(37,99,235,0.1);
            --text: #1E293B; --text-muted: #64748B;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); min-height: 100vh; padding-bottom: 90px; color: var(--text); }
        .top-header { position: sticky; top:0; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 16px 20px; box-shadow: 0 4px 15px rgba(37,99,235,0.25); }
        .top-header h1 { font-size: 18px; font-weight: 700; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .search-bar { width:100%; padding:12px 16px; border: 2px solid var(--border); border-radius:12px; font-size:15px; margin-bottom:16px; background:white; }
        .member-item { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
        .member-item:last-child { border-bottom:none; }
        .avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
        .member-left { display:flex; align-items:center; gap:12px; }
        .member-name { font-weight:600; font-size:15px; }
        .member-user { font-size:12px; color:var(--text-muted); margin-top:2px; }
        .member-actions button { background:none; border:none; color:var(--primary); cursor:pointer; padding:4px 8px; }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--card-bg); backdrop-filter:blur(10px); display:flex; justify-content:space-around; padding:10px 0; border-top:1px solid var(--border); z-index:100; box-shadow:0 -4px 15px rgba(37,99,235,0.12); }
        .nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-muted); text-decoration:none; font-size:10px; }
        .nav-btn i { font-size:20px; }
        .nav-btn.active { color:var(--primary); font-weight:600; }
        .loading { text-align:center; padding:30px; color:var(--text-muted); }
    </style>
</head>
<body>
    <header class="top-header"><h1>👥 Equipe</h1></header>
    <div class="container">
        <div class="card">
            <input type="text" class="search-bar" id="busca" placeholder="🔍 Buscar funcionário..." oninput="filtrar()">
            <div id="lista" class="loading">Carregando...</div>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="?page=geral" class="nav-btn"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="?page=equipe" class="nav-btn active"><i class="fas fa-users"></i> Equipe</a>
        <a href="?page=registros" class="nav-btn"><i class="fas fa-clipboard-list"></i> Registros</a>
        <a href="?page=ajustes" class="nav-btn"><i class="fas fa-cog"></i> Ajustes</a>
    </nav>
    <script>
        let todos = [];
        function navegarPara(p) { window.location.href = '?page=' + p; }
        function carregar() {
            google.script.run.withSuccessHandler(r=>{todos=r;render(r);}).getListaUsuarios();
        }
        function render(lista) {
            const c = document.getElementById('lista');
            c.innerHTML = lista.length ? '' : '<p style="text-align:center;color:var(--text-muted)">Nenhum funcionário encontrado</p>';
            lista.forEach(u=>{
                c.innerHTML += `<div class="member-item"><div class="member-left"><div class="avatar">${(u.nome||'')[0]||'?'}</div><div><div class="member-name">${u.nome}</div><div class="member-user">@${u.usuario}</div></div></div><div class="member-actions"><button onclick="verDetalhe('${u.id}')"><i class="fas fa-eye"></i></button></div></div>`;
            });
        }
        function filtrar() {
            const t = document.getElementById('busca').value.toLowerCase();
            render(todos.filter(u=>(u.nome+' '+u.usuario).toLowerCase().includes(t)));
        }
        function verDetalhe(id) { alert('Detalhes do funcionário: ' + id); }
        window.onload = carregar;
    </script>
</body>
</html>
